# OCW Build Diary – day 13 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-23/ (or ../DAY/ for another day).
# Spec rows 5.41–5.63; no release.
# Withheld: nothing – the day's 838 pictures and videos were checked (no
# desktop captures, no host or user names, home paths or addresses; OCW
# Studio's paths are relative (artwork/3dmodels/…); the browser's loading
# screens show only the world's signing keys; only made-up riders – the
# manifest's author in the Studio diff is Ada Rider).

title = "Off the road"
tagline = "In which Tenerife admits it has no autumn, street lamps step out of the map and into the riders' way, the trees keep their leaves, OCW Studio learns to edit, the iPhone goes on a diet – and the unicorn lands in a meadow, where the road ends and the woods begin."
hero = "152043-13a-meadow-to-road.jpg"
bpm = 132
key = "C"
style = "garage"                   # day 6 darkchip, 7 melodic deep house, 8 liquid dnb, 9 electro, 10 ambient, 11 trance, 12 dub: UK garage, a 2-step that skips past the third beat – for a day that leaves the road
mode = "minor"
outro = "Off the road, into the woods, back onto the road. 1,361 million tokens."
teaser = "NEXT TIME: J6 – the notch in the verge."
# The phone memory runs and the browser layout sweeps (the same ride again
# and again), the X11 twins, the plant files' 200-odd pictures from behind
# the unicorn's ears and the charts would flicker through the time-lapse:
timelapse_skip = ["*web-ios-*", "*lamps-layout-*", "*-x11*", "*e8fd6ab4-dirty-*", "*-chart-*", "*-plan-*",
                  "*-zoom-*", "*-case-*"]

