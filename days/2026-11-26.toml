# OCW Build Diary – day 16 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-26/ (or ../DAY/ for another day).
# Spec rows 6.03–6.66; no release.
# Withheld: 63 of the day's 317 pictures, videos and sounds – the browser
# app's on-page log (?log=1) on phones shows the Rust log lines with the
# crates' source paths under the build user's home (/home/<user>/.cargo/…);
# every log-panel screenshot is withheld, the seven plain error screens stay
# (build-history/withheld.txt). Checked and kept: the Fly.io server's status
# page shows only public counts and the public server's own address and
# certificate fingerprint; the ANT+ key page shows "0 of 16" digits; OCW Studio
# shows "~/…" and /tmp paths; the BRouter dialog 127.0.0.1; only made-up
# riders. The text: the Vercel and Fly.io tokens pasted into two prompts are
# masked as <token> (ocwart/mask.py), the ANT+ network key appears nowhere.

title = "A server of our own"
tagline = "In which a flaky test turns out to be a 17 g stop, the accounts get hearts on Postgres, the game server moves into Frankfurt on Fly.io, Andorra becomes the fifth world – and the locals were right about the poles at Envalira."
hero = "165347-scenes-unicorn-hornisgrinde-final-unicorn-hornisgrinde-tower.jpg"
bpm = 112
key = "D"
# style: none – the tool's rotation picks synthwave for day 16 (every style
# has played once by day 15; the cycle starts again with day 1's synthwave)
tests = 3800
outro = "64 spec versions, a fifth world, a server in Frankfurt, 230 GB freed. 1.71 billion tokens."
teaser = "NEXT TIME: six rebuilt worlds with smooth shores."
# The land-use runs, the browser log, the Fly.io test rides and the unicorn's
# probe frames would flicker through the time-lapse:
timelapse_skip = ["*landuse-*", "*web-log-*", "*remote-server-*", "*-remote-web-*", "*uh-probe*",
                  "*andorra-web-memory-*", "*beard-fix-*-before*"]

[[chapter]]
time = "04:54"
title = "OCW Studio's map, and a question"
caption = "The 2D map draws its land use again – the texture was made in another egui context. A patch now asks before it loads."
prompt = "The missing land use on OCW Studio's 2D map: should I start an agent to fix it? yes"
shots = [
  { file = "050046-landuse-compare-li-border-before-after.jpg", seconds = 4.6, note = "before | after" },
  { file = "064900-studio-q16-q18-patch-question.jpg", seconds = 4.0, focus = [0.12, 0.25, 1.6], note = "\"Load this world's patch?\"" },
  { file = "082033-fc80aa9f-dirty-shot-wayland-brouter-consent.jpg", seconds = 3.8, focus = [0.62, 0.5, 1.7], note = "asked once per server" },
  { card = true, seconds = 3.8, text = "Road edits act on the whole OSM way. The planner tests use our own BRouter on marge." },
]

[[chapter]]
time = "10:24"
title = "No UDP on Vercel"
caption = "The game talks over UDP, which Vercel cannot serve. So the game server goes to Fly.io – its UDP needs a credit card."
prompt = "lets keep it simple for now and put the psql on fly, too. increase budget authorization to 16$."
shots = [
  { card = true, seconds = 3.8, text = "08:55: a Fly.io account. 10:10: a card added, $10 a month authorised; 10:24: $16, with Postgres." },
]

[[chapter]]
time = "11:17"
title = "Traffic, UFOs and a cow"
caption = "Phase 18 is planned: cars, lorries, motorbikes, aircraft and UFOs, as a switch in Settings. Cars can hit riders."
prompt = "q1-3: yes, as proposed. q4: yes, cars can hit riders. add a lunatic mode, where cares drive like crazy and overtake in stupid and dangerous situations"
shots = [
  { card = true, seconds = 4.0, text = "UFOs come to the unicorn, on clear nights – and to crop circles and the cow. Live aircraft from adsb.lol." },
]

[[chapter]]
time = "11:51"
title = "The flaky test was a bug"
caption = "A gust put a bot level with the rider; the client braked the predicted bike from 7 to 3.7 m/s in one tick – a 17 g stop."
shots = [
  { card = true, seconds = 4.0, text = "The virtual brake now sheds at most 5 m/s² (0.5 g). 240 runs under load: 25 failures before, 0 after." },
]

