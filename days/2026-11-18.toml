# OCW Build Diary – day 8 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-18/ (or paths in this checkout).
# Pictures stand alone (spec §11.4 v3.25): a split only where a chapter compares two pictures.
# Withheld (build-history/withheld.txt): the build dashboard's two battery
# screenshots of 00:00 (the coordinator's user name readable on leela's card).

title = "A map in the corner, cracks in the road"
tagline = "In which the HUD gets a bike computer that names its towns, the roads crack as badly as OpenStreetMap says, the forks finally point forward – and every ride lands in one folder, ready for Strava, set up or not."
hero = "001616-scenes-navi-wayland-navi-li-route-day-720p.jpg"
bpm = 172
key = "G"
style = "liquid-dnb"               # day 6 darkchip, day 7 melodic deep house: something new and fast for a day on the road
mode = "dorian"
tests = 2948                       # marge's check of the frame-rate merge, 18:42: 74 suites, 0 failed
outro = "20 spec versions in one day, 4.67 to 4.87. Two releases, a map that names its towns, and roads exactly as bad as OpenStreetMap says."
# The release's icon sizes, the WebXR sweep frames and the browser test's
# six identical menu tours would flicker through the time-lapse:
timelapse_skip = ["*-icon-*", "*-xr-sweep-*", "*-xr-copy*", "*-web-web-*"]
teaser = "TO BE CONTINUED – lights on every bike at night, peaks on the navi map, and 75 open questions in plain words."

