# OCW Build Diary – day 15 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-25/ (or ../DAY/ for another day).
# Spec rows 5.81–6.02; release 0.2.6.
# Withheld: nothing – the day's 373 pictures and videos were checked (no
# desktop captures, no host or user names, home paths or LAN addresses; the
# sensor bridge's pages show only 127.0.0.1 (its pairing codes VZ00-… decode
# to the loopback address); Join a ride shows the documentation address
# 192.0.2.10; OCW Studio shows "~/…" and temporary /tmp paths; the trust
# dialog's signer 'Ada Rider' is made up; only made-up riders and bots).

title = "Chin up, 0.2.6"
tagline = "In which two close junctions share one surface, a zebra crossing goes back where OSM has it, riders sprint in the drops, 0.2.6 ships with five J9 worlds – and the bubble under every rider's chin is gone."
hero = "203837-7d97fded-dirty-shot-wayland-chin-a-side.jpg"
bpm = 124
key = "A"
# style: none – the tool's rotation picks house for day 15 (days 6–14 chose
# darkchip, melodic deep house, liquid dnb, electro, ambient, trance, dub,
# garage, acid; house has not played yet)
tests = 3550
outro = "22 spec versions, one release, one 29-hour process ended. 863 million tokens."
# The browser worker runs, the phone layouts, the release's browser tour,
# the sharing screen's 15 s frames, the icons, plots and comparison sheets
# would flicker through the time-lapse:
timelapse_skip = ["*b3w-*", "*bridge-desktop-*s.jpg", "*web-web-webkit-*", "*release-0.2.6-web-*",
                  "*windows-icon-*", "*-plans-*", "*chin-bubble-*"]

