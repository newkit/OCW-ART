# OCW Build Diary – day 11 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-21/ (or ../DAY/ for another day).
# The weekly token limit reset at 9:00 (day 10 had none); spec rows 5.17–5.23.
# Withheld: 100651-shot-wayland-menu-hosting-voice-off.jpg – Host a ride's
# join link shows the build machine's private network address (192.168.…).
# The rest of the day's 183 pictures and videos were checked: no desktop
# captures, no user names, home paths or addresses, only made-up riders.

title = "The tokens come back"
tagline = "In which the limit resets at nine, four agents start at once, the cursor keys stop doing two jobs, the host gets a Voice switch, crashes are heard from where they happen, and the browser sheds two thirds of its memory."
hero = "100702-shot-wayland-status-headphones-per-viewer.jpg"
bpm = 138
key = "A"
style = "trance"                   # day 6 darkchip, 7 melodic deep house, 8 liquid dnb, 9 electro, 10 ambient: uplifting trance for the comeback
mode = "minor"
outro = "320.9 million tokens, the morning after none. The crab has its pockets back."
# The browser test sweeps (the same menu tour twice), the memory runs'
# loading screens and the X11 twins of the Wayland shots would flicker
# through the time-lapse:
timelapse_skip = ["*web-web-*", "*-first-loading*", "*-compare-*", "*-teleport*"]

