# OCW Build Diary – day 6 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-16/ (or paths in this checkout).
# Pictures stand alone (spec §11.4 v3.25): a split only where a chapter compares two pictures.

title = "Moving day, a photographer and a headset at midnight"
tagline = "In which the coordinator moves house, a photographer with a drone joins every ride, voices get their own server – and a headset waits on a Windows desk."
hero = "212337-shot-wayland-status-group-mixed.jpg"
bpm = 140                          # half-time and broken drums: it feels slower
key = "D"
style = "darkchip"                 # 8-bit but cool (user 2026-11-17: "less squeeky and less happy …
mode = "dorian"                    # … make something cooler with different drums styles")
tests = 2583                       # marge's check of Voice V2's merge, 20:21: 71 suites, 0 failed
outro = "64 spec versions in one day, 3.75 to 4.38. A studio, a photographer with a drone, voices with their own server – and riders in VR goggles."
