# OCW Build Diary – day 7 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-17/ (or paths in this checkout).
# Pictures stand alone (spec §11.4 v3.25): a split only where a chapter compares two pictures.
# Withheld (build-history/withheld.txt): a whole-desktop capture of Weela and
# the build dashboard's battery screenshots (a user name readable).

title = "Faces, hands and a headset on a weak charger"
tagline = "In which the riders get faces, skin tones and real hands, the bike stand puts a price on speed, voices learn their range – and Weela rides VR until its battery gives up."
hero = "144129-shot-wayland-hands-arms-up.jpg"
bpm = 122
key = "F"
style = "melodic-deep-house"       # the user, 2026-11-18: "use music style: melodic deep house"
mode = "minor"
tests = 2797                       # marge's check of the OCW Studio logo's merge, 23:11: 71 suites, 0 failed
outro = "29 spec versions in one day, 4.39 to 4.68. Faces, skin tones, hands that hold the bar the right way up – and a model viewer at midnight."
# The thumbnail fixes' 300-odd 256 px part thumbnails and the icons' small
# sizes (16–512 px) would flicker through the time-lapse:
timelapse_skip = ["*-2026-11-17-thumbs-*", "*-icon-*-[0-9][0-9].png", "*-icon-*-[0-9][0-9][0-9].png",
                  "*-studio-logo-2026-11-17-ocw-*.png"]
teaser = "TO BE CONTINUED – a navigation map in the HUD, cracks in the road, and Weela on a stronger charger."

