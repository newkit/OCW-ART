# OCW Build Diary – day 12 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-22/ (or ../DAY/ for another day).
# Spec rows 5.24–5.40; release 0.2.5 published at 20:27.
# Withheld: nothing – the day's 387 pictures and videos were checked (no
# desktop captures, no user names, home paths or addresses; Join a ride shows
# the documentation address 192.0.2.10, not the home network; OCW Studio's
# paths read "~"; only made-up riders and bots).

title = "Smooth, with bumps"
tagline = "In which the riders move their lips, wet leaves bring them down, potholes kick the trainer, side roads leave from the kerb, the lamp posts step off the road, an iPhone stops restarting, the riders glide again – and 0.2.5 goes out."
hero = "104431-q24-lips-lips-speaking.jpg"
bpm = 74
key = "D"
style = "dub"                      # day 6 darkchip, 7 melodic deep house, 8 liquid dnb, 9 electro, 10 ambient, 11 trance: roots dub for a day of smooth roads and smooth riders
mode = "dorian"
outro = "Smooth junctions, smooth riders, bumpy roads – on purpose. 761 million tokens."
# The browser test sweeps (the same menu tour three times), the phone
# memory runs, the X11 twins of the junction scenes, the icon sizes and
# the loading screens would flicker through the time-lapse:
timelapse_skip = ["*web-web-*", "*web-ios-*", "*-x11-*", "*windows-icon-*", "*-loading*", "*-frames*"]

