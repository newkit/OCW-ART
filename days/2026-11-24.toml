# OCW Build Diary – day 14 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-24/ (or ../DAY/ for another day).
# Spec rows 5.65–5.80; no release.
# Withheld: nothing – the day's 3,502 pictures and videos were checked (no
# desktop captures, no host or user names, home paths or LAN addresses; the
# sensor bridge's desktop page and its QR code carry only 127.0.0.1 (the
# pairing code VZ00-… decodes to the loopback address); the headset page's
# code 00Z8-… is the WebXR test's fixed fixture, not an address of the build
# network; Join a ride shows the documentation address 192.0.2.10; OCW
# Studio shows a temporary /tmp path; only made-up riders and bots).

title = "Into the headset"
tagline = "In which the verges lose their notch, side paths join the road's side, the browser sheds 19 MB, the potholes stop being twins, a desktop lends its trainer to a browser – and the rider looks down at a bike computer on the bars, in VR."
hero = "192134-web-xr-web-xr-xr-computer.jpg"
bpm = 128
key = "F"
style = "acid"                     # day 6 darkchip, 7 melodic deep house, 8 liquid dnb, 9 electro, 10 ambient, 11 trance, 12 dub, 13 garage: acid – a squelching 303 line for a day of sharp corners filed round
mode = "minor"
outro = "Sixteen spec rows, nine questions answered, one headset not yet worn. 960 million tokens."
teaser = "NEXT TIME: a real headset on a real head?"
# The browser size and speed runs (2,859 pictures of the same rides again and
# again), the XR sweep frames, the lint plots and the comparison sheets would
# flicker through the time-lapse:
timelapse_skip = ["*wasm-size-*", "*xr-sweep-*", "*-plans-*", "*-plan-*", "*-case-*", "*-zoom-*", "*-cmp-*",
                  "*-web-web-*"]

