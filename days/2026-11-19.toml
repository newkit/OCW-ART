# OCW Build Diary – day 9 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-19/ (or paths in this checkout).
# Pictures stand alone (spec §11.4 v3.25): a split only where a chapter compares two pictures.
# Withheld: nothing – the day's 1,380 pictures were checked (no desktop
# captures, no user names or addresses, only made-up riders).

title = "Lights on, legs on"
tagline = "In which the riders' legs finally join their bodies, every bike gets a light at night, the maps name the peaks, helmets, lamps and the unicorn move into model files, and the browser learns to ride on a phone."
hero = "041435-shot-wayland-group-night-front-wayland.jpg"
bpm = 126
key = "E"
style = "electro"                  # day 6 darkchip, day 7 melodic deep house, day 8 liquid dnb: 808 electro for the busiest day yet
mode = "phrygian"
tests = 3107                       # marge's check of the phone-layout merge, 18:54: 74 suites, 0 failed
outro = "30 spec versions in one day, 4.88 to 5.17, and 1.59 billion tokens. Somebody was counting."
# The browser test sweeps (the same menu tour in every run), the
# photographer's chase frames and the X11 / 1080p twins of the Wayland
# shots would flicker through the time-lapse:
timelapse_skip = ["*-web-*", "*q5-shared*", "*-chase-*", "*-hidden-*", "*-1080*", "*-x11*", "*x11-*", "*-720p-x3*"]
teaser = "NEXT TIME: nothing at all. A crab checks its pockets."

