# OCW Build Diary – day 17 (docs/ART-PROJECT.md §4 describes every field).
# Shots are files in build-history/2026-11-27/ (or ../DAY/ for another day).
# Spec rows 6.67–6.99; release 0.2.7 (with Andorra).
# Withheld: nothing – the day's 718 pictures and videos were checked. The
# browser app's on-page log (?log=1), new since day 16, writes the crates'
# paths as "cargo:bevy_…" and "~/…" itself (ocw-log.js), and every log panel
# on the phones' screenshots shows only relative source paths, the test
# address 127.0.0.1 and "(hidden)" names (the full console logs with the build
# user's home stay in logs/, masked in the zip). The Fly.io status page shows
# the made-up rider Fenna Freewheel, the bot Echo and the public server's own
# address and certificate fingerprint; the ANT+ pages show "set" or
# "********** 10 of 16"; OCW Studio shows artwork/3dmodels; no desktop
# captures. The text: the iPhone page logs pasted into the prompts hold the
# phone's model, browser and language only, names "(hidden)" – no secrets;
# the ANT+ key and the Vercel and Fly.io tokens appear nowhere.

title = "Traffic, and a UFO took the cow"
tagline = "In which the iPhone gives up its shadows and its photographer, the heart beats pink, 0.2.7 ships with Andorra, cars learn to pass at 1.5 m (lunatics excepted), an airliner flies with the unicorn – and something lifts a cow over Liechtenstein."
hero = "132621-2026-11-27-aircraft-flyby-airliner-still-7-s.jpg"
bpm = 104
key = "E"
style = "funk"                     # day 16 synthwave restarted the rotation; funk has not played since day 2 – a slap bass for a day of traffic
mode = "dorian"
tests = 3799                       # the last full count of the day (04:03, 88 suites)
outro = "32 spec versions, a release with Andorra, ten traffic steps, one cow. 1.81 billion tokens."
teaser = "NEXT TIME: real worlds on the iPhone?"
# The phone bisect's log panels, the release's browser tour, the icons, the
# plots and the landscape runs would flicker through the time-lapse:
timelapse_skip = ["*web-bisect-*", "*web-log-*", "*-web-webkit-*", "*release-0.2.7-web-*",
                  "*windows-icon-*", "*t4plots-*", "*traffic-junctions-*", "*landscape-compare-*",
                  "*web-load-*", "*heart-*-zoom*"]

