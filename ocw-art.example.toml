# Copy to ocw-art.toml (git-ignored) for the settings of this machine.
# Environment variables win over it (OCW_REPO, OCW_ART_LFS_POLICY,
# OCW_ART_LFS_BUDGET_GIB).

# The OCW checkout the tool reads, when it is not ../OCW next to this one
# (a relative path is relative to this checkout).
ocw_repo = "../OCW"

# Git LFS (docs/ART-PROJECT.md §2.8): which media go into LFS, "all"
# (pictures and videos) or "pictures", and the budget in GiB (at most the
# free plan's 10 GiB).
# lfs_policy = "all"
# lfs_budget_gib = 9.0

# More private words for the mask (docs/ART-PROJECT.md §2.5; never printed):
# user names that are no build machine's (masked as "user") and real people's
# names that reached a prompt or a commit (masked as "<name>"), and keys that
# must never be published (masked as "<secret>"; a hex key also byte by byte,
# "AB CD …", "0xAB, 0xCD", any case). API tokens (Vercel, Fly.io, GitHub, …)
# are masked without a setting.
# mask_users = ["oldname"]
# mask_names = ["First Last"]
# mask_secrets = ["0011223344556677"]
