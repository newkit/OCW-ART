<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="${root}assets/ocw.svg" type="image/svg+xml">
<link rel="stylesheet" href="${root}assets/gallery.css">
</head>

      <p class="lb-cap"></p>
      <p class="lb-links"></p>
    </figcaption>
  </figure>
